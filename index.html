    <!-- Suppress harmless WebSocket/HMR transport errors in AI Studio iframe -->
    <script>
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? String(e.message) : '';
        var src = (e && e.filename) ? String(e.filename) : '';
        if (msg.includes('WebSocket') || msg.includes('@vite/client') || src.includes('@vite/client')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = (e && e.reason) ? String(e.reason) : '';
        if (reason.includes('WebSocket') || reason.includes('@vite/client')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
